# Single source of truth for every dependency and plugin version.
# jOOQ appears in three places (plugin, runtime, codegen) and JTE in two
# (plugin, runtime); the refs below keep them in lockstep.

[versions]
javalin = "7.2.3"
jooq = "3.21.7"
jte = "3.2.4"
jackson = "2.22.2"
jobrunr = "7.5.1"
micrometer = "1.17.1"
slf4j = "2.0.18"
logback = "1.6.3"
logstash = "9.0"
sqlite-jdbc = "3.53.4.0"
junit = "6.1.3"
shadow = "9.6.1"
versions-plugin = "0.61.0"

[libraries]
javalin-bom = { module = "io.javalin:javalin-bom", version.ref = "javalin" }
javalin-core = { module = "io.javalin:javalin" }
javalin-rendering-jte = { module = "io.javalin:javalin-rendering-jte" }
javalin-micrometer = { module = "io.javalin:javalin-micrometer" }
javalin-testtools = { module = "io.javalin:javalin-testtools" }
jte = { module = "gg.jte:jte", version.ref = "jte" }
jooq-core = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jobrunr = { module = "org.jobrunr:jobrunr", version.ref = "jobrunr" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
jte = { id = "gg.jte.gradle", version.ref = "jte" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versions-plugin" }
