<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse</title>
  <link rel="stylesheet" href="/tailwind.css">
  <script src="/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-mist text-ink antialiased">

  <header class="border-b border-ink/10 bg-white">
    <div class="mx-auto flex max-w-4xl items-center gap-3 px-6 py-4">
      <svg class="h-6 w-10 text-pine" viewBox="0 0 40 24" fill="none" aria-hidden="true">
        <path d="M0 12h9l3-8 5 16 4-12 2 4h17" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="text-xl font-semibold tracking-tight">Pulse</span>
      <span class="ml-auto text-sm text-ink/50">2 of 3 monitors up</span>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-6 py-10">

    <div class="mb-6 flex items-baseline justify-between">
      <h1 class="text-2xl font-semibold tracking-tight">Monitors</h1>
      <a href="#" class="rounded-md bg-pine px-3.5 py-2 text-sm font-medium text-white hover:bg-pine-deep">
        Add monitor
      </a>
    </div>

    <!-- The board: replaced by a live fragment in a later stage -->
    <section id="board" class="divide-y divide-ink/10 overflow-hidden rounded-lg border border-ink/10 bg-white">

      <article class="flex items-center gap-4 border-l-[3px] border-l-up px-5 py-4">
        <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-up"></span>
        <div class="min-w-0 flex-1">
          <h2 class="truncate font-medium">sporcic.org</h2>
          <p class="truncate text-sm text-ink/50">https://sporcic.org</p>
        </div>
        <div class="text-right">
          <p class="text-lg font-light tabular-nums">84<span class="text-sm text-ink/50"> ms</span></p>
          <p class="text-sm tabular-nums text-ink/50">100% uptime</p>
        </div>
      </article>

      <article class="flex items-center gap-4 border-l-[3px] border-l-up px-5 py-4">
        <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-up"></span>
        <div class="min-w-0 flex-1">
          <h2 class="truncate font-medium">API</h2>
          <p class="truncate text-sm text-ink/50">https://api.sporcic.org/health</p>
        </div>
        <div class="text-right">
          <p class="text-lg font-light tabular-nums">121<span class="text-sm text-ink/50"> ms</span></p>
          <p class="text-sm tabular-nums text-ink/50">99.8% uptime</p>
        </div>
      </article>

      <article class="flex items-center gap-4 border-l-[3px] border-l-down px-5 py-4">
        <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-down"></span>
        <div class="min-w-0 flex-1">
          <h2 class="truncate font-medium">Docs</h2>
          <p class="truncate text-sm text-ink/50">https://docs.sporcic.org</p>
        </div>
        <div class="text-right">
          <p class="text-lg font-light text-down">down</p>
          <p class="text-sm tabular-nums text-ink/50">97.2% uptime</p>
        </div>
      </article>

    </section>

    <p class="mt-4 text-sm text-ink/40">Checks run every 60 seconds. This board is a static preview.</p>

  </main>

</body>
</html>
