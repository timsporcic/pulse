plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.8'   // keep in sync with jooqVersion below
    id 'gg.jte.gradle' version '3.2.4'                   // keep in sync with gg.jte:jte below
    id 'io.github.ben-manes.versions' version '0.61.0'
}

// the plugins block above cannot reference variables, so the codegen plugin
// carries the same version as a literal
def jooqVersion = '3.21.8'

group = 'org.sporcic'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.javalin:javalin-bom:7.2.3')
    implementation 'io.javalin:javalin'
    implementation 'io.javalin:javalin-rendering-jte'
    implementation 'io.javalin:javalin-micrometer'
    implementation 'gg.jte:jte:3.2.4'

    implementation "org.jooq:jooq:$jooqVersion"
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    jooqCodegen "org.jooq:jooq-meta-extensions:$jooqVersion"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'org.jobrunr:jobrunr:8.8.2'

    implementation 'io.micrometer:micrometer-registry-prometheus:1.17.1'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    runtimeOnly 'ch.qos.logback:logback-classic:1.6.3'
    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:9.0'

    testImplementation 'io.javalin:javalin-testtools'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.sporcic.pulse.App'
}

def jooqGeneratedDir = 'build/generated/sources/jooq/java/main'

jooq {
    configuration {
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                properties {
                    property {
                        key = 'scripts'
                        value = 'src/main/resources/db/schema.sql'
                    }
                    // non-default: lets schema.sql hide the runtime-only
                    // CREATE INDEX from codegen (see the comment there)
                    property {
                        key = 'parseIgnoreComments'
                        value = 'true'
                    }
                }
            }
            target {
                packageName = 'org.sporcic.pulse.jooq'
                directory = jooqGeneratedDir
            }
        }
    }
}

sourceSets.main.java.srcDir jooqGeneratedDir

// the jOOQ plugin does not wire this itself; without it a fresh clone
// (or clean build) fails before the generated classes exist
tasks.named('compileJava') { dependsOn 'jooqCodegen' }

jte {
    // Templates are compiled to Java classes at build time and shipped in the
    // jar - no runtime compilation, works inside the shadow jar.
    generate()
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:all')
}

javadoc {
    // generated code (jOOQ, precompiled JTE) documents itself or doesn't need to
    exclude 'org/sporcic/pulse/jooq/**'
    exclude 'gg/jte/generated/**'
    // keep doclint's real checks, skip the missing-@return/@param pedantry
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

shadowJar {
    // several deps register via META-INF/services (JDBC driver, logback,
    // jackson); merge them instead of letting the last jar win
    mergeServiceFiles()
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
