plugins {
    id 'application'
    alias(libs.plugins.shadow)
    alias(libs.plugins.jooq.codegen)
    alias(libs.plugins.jte)
    alias(libs.plugins.versions)
}

group = 'org.sporcic'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(libs.javalin.bom)
    implementation libs.javalin.core
    implementation libs.javalin.rendering.jte
    implementation libs.javalin.micrometer
    implementation libs.jte

    implementation libs.jooq.core
    implementation libs.sqlite.jdbc
    jooqCodegen libs.jooq.meta.extensions

    implementation libs.jackson.databind
    implementation libs.jobrunr

    implementation libs.micrometer.prometheus

    implementation libs.slf4j.api
    runtimeOnly libs.logback.classic
    runtimeOnly libs.logstash.encoder

    testImplementation libs.javalin.testtools
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

application {
    mainClass = 'org.sporcic.pulse.App'
}

def jooqGeneratedDir = 'build/generated/sources/jooq/java/main'

jooq {
    configuration {
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                properties {
                    property {
                        key = 'scripts'
                        value = 'src/main/resources/db/schema.sql'
                    }
                    // non-default: lets schema.sql hide the runtime-only
                    // CREATE INDEX from codegen (see the comment there)
                    property {
                        key = 'parseIgnoreComments'
                        value = 'true'
                    }
                }
            }
            target {
                packageName = 'org.sporcic.pulse.jooq'
                directory = jooqGeneratedDir
            }
        }
    }
}

sourceSets.main.java.srcDir jooqGeneratedDir

// the jOOQ plugin does not wire this itself; without it a fresh clone
// (or clean build) fails before the generated classes exist
tasks.named('compileJava') { dependsOn 'jooqCodegen' }

jte {
    // Templates are compiled to Java classes at build time and shipped in the
    // jar - no runtime compilation, works inside the shadow jar.
    generate()
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all'])
}

javadoc {
    // generated code (jOOQ, precompiled JTE) documents itself or doesn't need to
    exclude 'org/sporcic/pulse/jooq/**'
    exclude 'gg/jte/generated/**'
    // keep doclint's real checks, skip the missing-@return/@param pedantry
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

shadowJar {
    // several deps register via META-INF/services (JDBC driver, logback,
    // jackson); merge them instead of letting the last jar win
    mergeServiceFiles()
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
