# Litestream: continuous replication of the SQLite file to object storage.
# Credentials come from the environment (systemd drop-in or /etc/litestream.env):
#   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY
# The endpoint below is DigitalOcean Spaces; any S3-compatible store works.

dbs:
  - path: /var/lib/pulse/pulse.db
    replicas:
      - type: s3
        bucket: pulse-litestream
        path: pulse.db
        endpoint: https://nyc3.digitaloceanspaces.com
        region: nyc3
