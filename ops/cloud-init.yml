#cloud-config
# Bootstraps a fresh Ubuntu box into a running Pulse host:
# Temurin JDK 26, Caddy, Litestream, the pulse user, and the systemd unit.
# The jar and config files are fetched from the deploy bucket; 09-iac wires
# the real bucket URL and credentials in via OpenTofu templating.

users:
  - name: pulse
    system: true
    shell: /usr/sbin/nologin

# the SQLite file lives on the attached volume, which outlives the droplet
mounts:
  - ["${volume_device}", /var/lib/pulse, ext4, "defaults,nofail,discard", "0", "2"]

package_update: true
packages:
  - curl
  - ca-certificates

write_files:
  - path: /etc/systemd/system/pulse.service
    content: |
      ${indent(6, pulse_service)}
  - path: /etc/systemd/system/pulse-restore.service
    content: |
      ${indent(6, restore_service)}
  - path: /etc/systemd/system/litestream.service
    content: |
      ${indent(6, litestream_service)}
  - path: /etc/litestream.env
    permissions: '0600'
    encoding: b64
    content: ${litestream_env_b64}
  - path: /etc/caddy/pulse-users
    permissions: '0600'
    encoding: b64
    content: ${caddy_users_b64}

runcmd:
  # Temurin JDK 26 (tarball via the Adoptium API; symlinked into /usr/bin)
  - mkdir -p /opt/java
  - curl -fsSL "https://api.adoptium.net/v3/binary/latest/26/ga/linux/x64/jdk/hotspot/normal/eclipse" -o /tmp/jdk.tar.gz
  - tar -xzf /tmp/jdk.tar.gz -C /opt/java --strip-components=1
  - ln -sf /opt/java/bin/java /usr/bin/java

  # Caddy (official apt repo)
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update && apt-get install -y caddy

  # Litestream (single Go binary)
  - curl -fsSL "https://github.com/benbjohnson/litestream/releases/latest/download/litestream-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin

  # make sure the data volume is mounted even if it attached late
  - mountpoint -q /var/lib/pulse || mount -a
  - mountpoint -q /var/lib/pulse && chown pulse:pulse /var/lib/pulse

  # Pulse itself: jar + configs from the deploy bucket (URL templated in 09-iac)
  - mkdir -p /opt/pulse /var/lib/pulse
  - curl -fsSL "${deploy_bucket_url}/pulse-all.jar" -o /opt/pulse/pulse-all.jar
  - curl -fsSL "${deploy_bucket_url}/Caddyfile" -o /etc/caddy/Caddyfile
  - curl -fsSL "${deploy_bucket_url}/litestream.yml" -o /etc/litestream.yml
  - mountpoint -q /var/lib/pulse && chown -R pulse:pulse /var/lib/pulse

  # Authentication is private; only the Caddy process needs the password hash.
  - chown root:caddy /etc/caddy/pulse-users
  - chmod 640 /etc/caddy/pulse-users
  - caddy validate --config /etc/caddy/Caddyfile

  # Both services require a successful restore and a mounted data volume.
  - systemctl daemon-reload
  - systemctl enable pulse litestream caddy
  - systemctl restart caddy
  - systemctl start pulse litestream
